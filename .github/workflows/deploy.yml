name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - name: List dist
        run: find dist -type f | sort
      - name: Fix wrangler.json
        run: |
          node -e "
          const fs=require('fs');
          const p='dist/server/wrangler.json';
          if(fs.existsSync(p)){
            const c=JSON.parse(fs.readFileSync(p));
            delete c.no_bundle;
            c.main='server.js';
            fs.writeFileSync(p,JSON.stringify(c,null,2));
            console.log('Fixed:', JSON.stringify(c,null,2));
          } else {
            console.log('wrangler.json not found, listing dist/server:');
            try { console.log(fs.readdirSync('dist/server').join('\n')); } catch(e){ console.log('dist/server not found'); }
          }"
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: deploy --config dist/server/wrangler.json
